{% extends 'base.html' %}{% block content %}<div class="page-heading"><div><h1>Capture face photos</h1><p>{{student.name}} · {{student.roll_no}} — capture 15–25 clear, front-facing photos.</p></div><a class="btn btn-light" href="{{url_for('students.index')}}">Done</a></div><div class="panel camera-panel"><video id="video" autoplay></video><canvas id="canvas" hidden></canvas><div class="camera-controls"><button type="button" id="startCamera" class="btn btn-outline-primary">Start camera</button><button type="button" id="capture" class="btn btn-primary" disabled><i class="bi bi-camera"></i> Capture photo</button><span id="saved" class="text-muted">No photos saved</span></div></div>{% endblock %}{% block scripts %}<script>window.captureConfig={saveUrl:"{{url_for('camera.save_capture',student_id=student.id)}}"};</script><script src="{{url_for('static',filename='js/camera.js')}}"></script>{% endblock %}
