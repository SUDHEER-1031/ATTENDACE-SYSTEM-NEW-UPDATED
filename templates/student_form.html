{% extends 'base.html' %}{% block content %}<div class="page-heading"><div><h1>{{ 'Edit student' if student else 'Add student' }}</h1><p>Create and maintain student profiles.</p></div><a class="btn btn-light" href="{{url_for('students.index')}}">Cancel</a></div><div class="panel form-panel"><form method="post" class="row g-3"><div class="col-md-6"><label class="form-label">Roll number *</label><input class="form-control" name="roll_no" value="{{student.roll_no if student else ''}}" required></div><div class="col-md-6"><label class="form-label">Full name *</label><input class="form-control" name="name" value="{{student.name if student else ''}}" required></div><div class="col-md-6"><label class="form-label">Department *</label><input class="form-control" name="department" value="{{student.department if student else ''}}" required></div><div class="col-md-6"><label class="form-label">Email</label><input type="email" class="form-control" name="email" value="{{student.email if student else ''}}"></div><div class="col-md-6"><label class="form-label">Phone</label><input class="form-control" name="phone" value="{{student.phone if student else ''}}"></div><div class="col-12"><button class="btn btn-primary">{{ 'Save changes' if student else 'Add and capture photos' }}</button></div></form></div>{% endblock %}
