<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FaceTrack | Sign in</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet"><link rel="stylesheet" href="{{ url_for('static',filename='css/style.css') }}"></head><body class="login-page"><section class="login-card"><div class="login-logo"><i class="bi bi-person-bounding-box"></i></div><h1>Welcome back</h1><p>Sign in to manage attendance.</p>{% with messages=get_flashed_messages(with_categories=true) %}{% for c,m in messages %}<div class="alert alert-{{c}}">{{m}}</div>{% endfor %}{% endwith %}<form method="post"><label for="username">Username</label><input id="username" name="username" class="form-control" required autofocus><label for="password">Password</label><input id="password" type="password" name="password" class="form-control" required><button type="submit" class="btn btn-primary w-100 mt-4">Sign in <i class="bi bi-arrow-right"></i></button></form><small>Default login: <b>admin</b> / <b>admin123</b></small></section></body></html>
